# ============================================================================
# 📁 Fichier : application-prod.properties
# 📝 Description : Configuration du profil PROD (Production) pour LekkRek
# 🔒 Sécurité : validation stricte du schéma SQL, masquage des requêtes SQL
# ============================================================================

# JPA / Hibernate : validation stricte (aucun ddl-auto destructeur en production)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Swagger / OpenAPI désactivé en production pour limiter l'exposition d'API
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Niveau de log standard pour la production
logging.level.com.lekkrek=INFO

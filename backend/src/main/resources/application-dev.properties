# ============================================================================
# 📁 Fichier : application-dev.properties
# 📝 Description : Configuration du profil DEV (Développement local) pour LekkRek
# ============================================================================

# JPA / Hibernate : mise à jour automatique du schéma et logs SQL complets
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI activé pour tester les endpoints
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Niveau de log pour le développement
logging.level.com.lekkrek=DEBUG

# Support optionnel pour charger les variables depuis un fichier .env (racine du projet ou backend/)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Application Settings
spring.application.name=lekk-rek-api
server.port=8080

# Profil Spring actif par défaut (dev pour le développement local, prod en production)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lekkrek_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:lekkrek_app}
spring.datasource.password=${DB_PASSWORD:lekkrek_app_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate - Paramètres communs (spécifiés dans application-dev et application-prod)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# API Prefix Configurations
api.prefix.public=/api/v1/public
api.prefix.admin=/api/v1/admin
api.prefix.operator=/api/v1/operator
api.prefix.webhook=/api/v1/webhooks

# JWT Configuration (durée de validité réduite à 4 heures pour limiter la fenêtre de risque)
# Aucune clé par défaut (dépôt public) : définir JWT_SECRET dans le .env (openssl rand -hex 64).
# Sans clé : refus de démarrer en prod, clé aléatoire temporaire en dev (voir JwtUtils).
jwt.secret=${JWT_SECRET:}
jwt.expirationMs=${JWT_EXPIRATION_MS:14400000}

# CORS Configuration
# En production, définir CORS_ALLOWED_ORIGINS avec les domaines autorisés (séparés par des virgules)
# Exemple : https://lekkrek.com,https://www.lekkrek.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Image Migration Runner (désactivé par défaut pour éviter tout SSRF ou surcharge au démarrage)
lekkrek.image-migration.enabled=${IMAGE_MIGRATION_ENABLED:false}

# Upload de fichiers — limite à 10 Mo (le contrôleur valide lui-même à 5 Mo)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# DataLoader (désactivé par défaut pour préserver les vraies données)
app.dataloader.enabled=${APP_DATALOADER_ENABLED:true}

# Auth Cookie (Option A : JWT en cookie HttpOnly pour le web ; le mobile Expo
# continue d'utiliser le header Authorization: Bearer). secure=true en prod HTTPS.
auth.cookie.path=/api
auth.cookie.secure=true

# ════════════════════════════════════════════════════════════════════════════
# PayTech — Passerelle de paiement (Wave, Orange Money, Free Money, CB)
# Les clés doivent être définies via des variables d'environnement (ex: fichier .env)
# ════════════════════════════════════════════════════════════════════════════
paytech.api-key=${PAYTECH_API_KEY:}
paytech.api-secret=${PAYTECH_API_SECRET:}
paytech.url.request=${PAYTECH_URL_REQUEST:https://paytech.sn/api/payment/request-payment}
paytech.env=${PAYTECH_ENV:test}
paytech.ipn-url=${PAYTECH_IPN_URL:https://lekkrek.com/api/v1/public/payments/ipn}
paytech.success-url=${PAYTECH_SUCCESS_URL:http://localhost:5173/?payment=success}
paytech.cancel-url=${PAYTECH_CANCEL_URL:http://localhost:5173/?payment=cancel}

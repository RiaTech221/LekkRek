# Application Settings
spring.application.name=lekk-rek-api
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lekkrek_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# API Prefix Configurations
api.prefix.public=/api/v1/public
api.prefix.operator=/api/v1/operator
api.prefix.webhook=/api/v1/webhooks

# JWT Configuration
jwt.secret=${JWT_SECRET:LekkRekDevSecretKeyMustBeAtLeast256BitsLongForHS256Algorithm!!}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
# En production, définir CORS_ALLOWED_ORIGINS avec les domaines autorisés (séparés par des virgules)
# Exemple : https://lekkrek.com,https://www.lekkrek.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

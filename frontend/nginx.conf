# =============================================================================
# 🔒 Durcissement Nginx — LekkRek (frontend)
# - Version du serveur masquée
# - Limites de taille et délais (anti-flood basique)
# =============================================================================

# Masque la version : "Server: nginx" au lieu de "nginx/1.2x"
server_tokens off;

# Borne les uploads (images de plats) et ferme les connexions lentes
client_max_body_size 10m;
client_body_timeout 30s;
client_header_timeout 30s;
send_timeout 30s;
keepalive_timeout 65s;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------------
    # 🛡️ En-têtes de sécurité
    # Hérités par toutes les locations qui ne déclarent pas eux-mêmes d'add_header.
    # (Règle Nginx : un add_header local remplace tous ceux hérités → les
    #  locations qui en ajoutent un doivent les redéclarer, cf. plus bas.)
    # ---------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP en mode observation : rien n'est bloqué, les violations apparaissent
    # dans la console (DevTools) pendant la phase de réglage.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://ui-avatars.com https://raw.githubusercontent.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # GZIP Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ---------------------------------------------------------------------------
    # 🚫 Fichiers cachés / sensibles : jamais servis (.env, .git, .htaccess, …)
    #    Regex évaluée avant les locations préfixées.
    # ---------------------------------------------------------------------------
    location ~ /\. {
        return 404;
    }

    # ---------------------------------------------------------------------------
    # Frontend routes (SPA support)
    # Aucun add_header ici → héritage des en-têtes de sécurité ci-dessus.
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Caching statique (fichiers hachés par Vite)
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
            access_log off;
            # add_header local : redéclaration obligatoire des en-têtes de sécurité
            # (un seul Cache-Control : "expires" en dupliquerait un deuxième)
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://ui-avatars.com https://raw.githubusercontent.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        }
    }

    # index.html (direct ou fallback try_files) : jamais caché, sinon le
    # navigateur sert un ancien bundle après déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache";
        # add_header local : redéclaration obligatoire des en-têtes de sécurité
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://ui-avatars.com https://raw.githubusercontent.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # ---------------------------------------------------------------------------
    # Reverse proxy pour l'API Spring Boot
    # Aucun add_header → héritage des en-têtes de sécurité.
    # ---------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # L'empreinte du backend ne doit pas fuiter côté client, et les
        # en-têtes de sécurité qu'il envoie sont remplacés par ceux de Nginx
        # (sinon doublons, et X-Frame-Options DENY entrerait en conflit)
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;

        # Anti-flood côté proxy : une requête API qui traîne est coupée
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------------------
    # Fichiers uploadés (images) : servis par le backend, même origine
    # Aucun add_header → héritage des en-têtes de sécurité.
    # ---------------------------------------------------------------------------
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Content-Type-Options;
    }
}

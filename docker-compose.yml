version: '3.8'

services:
  # Base de données MySQL
  db:
    image: mysql:8.0
    container_name: lekkrek_mysql
    environment:
      MYSQL_DATABASE: lekkrek_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  # Backend Spring Boot
  backend:
    build: 
      context: ./backend
    container_name: lekkrek_backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_URL=jdbc:mysql://db:3306/lekkrek_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USER=root
      - DB_PASSWORD=root
    restart: unless-stopped

  # Frontend React (Vite)
  frontend:
    build:
      context: ./frontend
    container_name: lekkrek_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    restart: unless-stopped

volumes:
  db_data:

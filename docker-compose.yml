version: '3.8'

services:
  # Base de données MySQL
  db:
    image: mysql:8.0
    container_name: lekkrek_mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lekkrek_db}
      MYSQL_USER: ${DB_USER:-lekkrek_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lekkrek_app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me_in_prod}
    # Port 3306 non exposé sur l'hôte : accès réservé au réseau interne Docker
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  # Backend Spring Boot
  backend:
    build: 
      context: ./backend
    container_name: lekkrek_backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_URL=jdbc:mysql://db:3306/lekkrek_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USER=${DB_USER:-lekkrek_app}
      - DB_PASSWORD=${DB_PASSWORD:-lekkrek_app_password}
    restart: unless-stopped

  # Frontend React (Vite)
  frontend:
    build:
      context: ./frontend
    container_name: lekkrek_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
    restart: unless-stopped

volumes:
  db_data:
